{% extends "base.html" %}
{% block title %}Error {{ code }} · {{ site_name }}{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="text-center py-5">
    <div class="display-1 fw-bold text-success mb-3">{{ code }}</div>
    <h1 class="h3 mb-3">Something went sideways</h1>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-success"><i class="bi bi-house me-1"></i>Back to home</a>
  </div>
</section>
{% endblock %}
